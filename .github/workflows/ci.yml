name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test
        env:
          KICAD_NOT_AVAILABLE: "1"

      - name: Routing tests
        run: npm run test:routing
        env:
          KICAD_NOT_AVAILABLE: "1"

      - name: Coverage
        run: npm run test:coverage
        env:
          KICAD_NOT_AVAILABLE: "1"
