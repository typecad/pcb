# Release — version PR on push with pending changesets, publish on merge.
# Publishing authenticates with npm TRUSTED PUBLISHING (OIDC): each package's
# trusted publisher on npmjs.com must name THIS repository, THIS workflow
# file (release.yml) and (optionally) a GitHub environment — no NPM_TOKEN
# secret exists to leak or rotate.
name: Release

on:
  push:
    branches: [master]

# Serialize releases — a second push must never race a publish in flight.
concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # the action opens the Version Packages PR and pushes tags
  id-token: write # npm trusted publishing: mint the OIDC token

jobs:
  release:
    name: Version or Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # changesets diffs against the last release tag

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm >= 11.5 for the non-interactive OIDC
      # login; Node 22 bundles an older npm.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test -ws --if-present
        env:
          KICAD_NOT_AVAILABLE: '1'

      # OIDC exchange: the workflow identity becomes a short-lived npm
      # credential. Must run before the action's publish command.
      - name: npm login (trusted publishing)
        run: npm login --auth-type=oauth

      # version: consume changesets + refresh the lockfile + bundle the
      # extension asset — all of it rides the Version Packages PR.
      # publish: gate on the asset being exactly fresh, then changeset
      # publish. Nothing to publish = clean no-op.
      - name: Create version PR or publish
        uses: changesets/action@v1
        with:
          version: npm run ci:version
          publish: npm run ci:publish
          commit: 'Version Packages (pre-release)'
          title: 'Version Packages (pre-release)'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
