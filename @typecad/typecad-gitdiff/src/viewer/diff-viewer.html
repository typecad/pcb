<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PCB Layer Diff Viewer</title>
    <link rel="icon" type="image/x-icon" href="https://typecad.net/favicon.ico" />
    <link
      href="https://cdn.jsdelivr.net/npm/basecoat-css@0.2.8/dist/basecoat.cdn.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
      integrity="sha256-EdEjlMPJ0mScFS3wMHNYLehIiUpxxqr6Ipavq9cgOrI="
    />
    <script
      src="https://cdn.jsdelivr.net/npm/basecoat-css@0.2.8/dist/js/all.min.js"
      defer
      crossorigin="anonymous"
      integrity="sha256-za6AmRs8YyYkjvc6YLmb+Hs3BWOBmxG8tfdl6ug500U="
    ></script>
    <!-- INLINE_CSS -->
  </head>
  <body>
    <div class="theme-switcher">
      <button type="button" id="themeToggle" aria-label="Toggle theme" class="btn-icon-outline size-8">
        <span id="sunIcon">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2" />
            <path d="M12 20v2" />
            <path d="m4.93 4.93 1.41 1.41" />
            <path d="m17.66 17.66 1.41 1.41" />
            <path d="M2 12h2" />
            <path d="M20 12h2" />
            <path d="m6.34 17.66-1.41 1.41" />
            <path d="m19.07 4.93-1.41 1.41" />
          </svg>
        </span>
        <span id="moonIcon" style="display: none">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
          </svg>
        </span>
      </button>
    </div>

    <div class="container">
      <div class="header">
        <h1 class="title"><a href="https://typecad.net">typeCAD</a> git-diff</h1>
      </div>

      <div class="main-card card">
        <div class="layer-controls">
          <div class="layer-badges-container" id="layerBadgesContainer"></div>

          <div class="layer-opacity" id="globalOpacityControls" style="display: flex;">
            <label for="globalOpacitySlider">Layer Transparency</label>
            <input type="range" id="globalOpacitySlider" min="20" max="100" value="70" />
            <span id="globalOpacityValue">70%</span>
          </div>

          <div class="layer-opacity" id="opacityControls" style="display: none">
            <label for="opacitySlider">Overlay Opacity</label>
            <input type="range" id="opacitySlider" min="0" max="100" value="50" />
            <span id="opacityValue">50%</span>
          </div>

          <div class="view-mode-controls">
            <label for="viewModeSelect">View Mode</label>
            <select id="viewModeSelect" class="button button--outline">
              <option value="diff-only">Diff Only</option>
              <option value="side-by-side">Side by Side</option>
              <option value="overlay">Overlay</option>
              <option value="onion-skin">Onion Skin</option>
              <option value="swipe">Swipe Compare</option>
            </select>
          </div>
        </div>

        <div class="image-viewer">
          <div class="diff-sidebar" id="diffSidebar">
            <div class="diff-sidebar-header">
              <h3>Changes</h3>
              <span class="diff-sidebar-summary" id="diffSidebarSummary"></span>
              <button class="diff-sidebar-close" id="diffSidebarClose">&times;</button>
            </div>
            <div class="diff-sidebar-content" id="diffSidebarContent"></div>
          </div>

          <button class="diff-sidebar-toggle" id="diffSidebarToggle">
            Changes<span class="toggle-count" id="diffToggleCount">0</span>
          </button>

          <div class="image-stack" id="imageStack">
            <div class="zoom-controls" id="zoomControls" style="display: none;">
              <button class="zoom-btn" id="zoomInBtn" title="Zoom In">+</button>
              <button class="zoom-btn" id="zoomOutBtn" title="Zoom Out">−</button>
              <button class="zoom-btn" id="zoomResetBtn" title="Reset Zoom">⌂</button>
            </div>

            <div class="zoom-info" id="zoomInfo" style="display: none;">
              Zoom: <span id="zoomLevel">100%</span>
            </div>

            <div class="empty-viewer" id="emptyViewer">
              <div class="empty-viewer-icon">🔧</div>
              <h3>No PCB layers selected</h3>
              <p>Choose PCB layers from the dropdown above to view differences</p>
            </div>

            <div class="empty-viewer" id="noDifferencesViewer" style="display: none">
              <div class="empty-viewer-icon">✅</div>
              <h3>No differences found</h3>
              <p>All PCB layers are identical between the compared files</p>
            </div>
          </div>
        </div>

        <div class="card-footer" id="cardFooter" style="display: none">
          <div class="diff-legend">
            <div class="legend-item">
              <div class="legend-swatch legend-removed"></div>
              <span class="legend-label">Removed Feature</span>
            </div>
            <div class="legend-item">
              <div class="legend-swatch legend-added"></div>
              <span class="legend-label">Added Feature</span>
            </div>
          </div>
          <div class="side-by-side-labels" id="sideBySideLabels" style="display: none !important;">
            <div class="label-item">
              <span class="label-text">Original</span>
            </div>
            <div class="label-item">
              <span class="label-text">Modified</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- INLINE_JS -->
  </body>
</html>
