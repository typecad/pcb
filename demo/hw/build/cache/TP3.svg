<svg data-svg-type="footprint" width="30" height="34.5" xmlns="http://www.w3.org/2000/svg">
<defs>
<style><![CDATA[
g[data-component][data-rotated-180] .pin-name-text,
g[data-component][data-rotated-180] .pin-number-text,
g[data-component][data-rotated-180] .pin-name-overline {
    transform: scale(-1, -1);
    transform-origin: center;
    transform-box: fill-box;
}
/* Keep overline above text when flipped */
g[data-component][data-rotated-180] .pin-name-overline { display: none; }
g[data-component][data-rotated-180] .pin-name-text--overline { text-decoration: overline; }
]]></style>
</defs>
<rect width="30" height="34.5" fill="#2e3440"/>
<g transform="translate(15, 19.5)">
<circle cx="0" cy="0" r="7" fill="none" stroke="#c47b99" stroke-width="1"/>
<circle cx="0" cy="0" r="10" fill="none" stroke="#c2c2c2" stroke-width="1"/>
<text x="0" y="-14.5" font-family="Consolas, Monaco, Courier New, monospace" font-size="12" fill="#c47b99" text-anchor="middle" dominant-baseline="central">${REFERENCE}</text>
<circle cx="0" cy="0" r="5" fill="#b3474d" stroke="none" stroke-width="2"/>
</g>
</svg>