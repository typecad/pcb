<head>

    <!-- Component Location Manager -->
    <script>
        // SVG Embedded Component Location Manager
        class ComponentLocationManager {
            constructor() {
                this.locations = new Map();
                this.VERSION = '1.0.0';
                this.svgContent = '';
                this.loadLocations();
            }

            async loadLocations() {
                try {
                    // Load from SVG data element
                    this.loadFromSvg();
                } catch (error) {
                    console.warn(`Could not load component locations: ${error}`);
                }
            }
            
            loadFromSvg() {
                try {
                    // Get SVG element and look for location data directly in the DOM
                    const svgElement = document.querySelector('svg');
                    if (svgElement) {
                        // Look for location data element directly in the DOM
                        const dataElement = svgElement.querySelector('data[id="component-locations"]');
                        if (dataElement) {
                            const jsonData = dataElement.textContent.trim();
                            if (jsonData) {
                                const locationData = JSON.parse(jsonData);
                                
                                if (locationData.version === this.VERSION) {
                                    locationData.components.forEach(comp => {
                                        this.locations.set(comp.uuid, comp);
                                    });
                                    console.log(`Loaded ${this.locations.size} component locations from SVG data element`);
                                } else {
                                    console.warn(`Location data version mismatch. Expected ${this.VERSION}, found ${locationData.version}. Starting fresh.`);
                                }
                            } else {
                                console.log('No location data content found in SVG data element');
                            }
                        } else {
                            console.log('No location data element found in SVG');
                        }
                    } else {
                        console.log('No SVG element found on page');
                    }
                } catch (error) {
                    console.warn(`Could not load component locations from SVG: ${error}`);
                }
            }

            saveLocations() {
                const locationData = {
                    version: this.VERSION,
                    lastUpdated: Date.now(),
                    components: Array.from(this.locations.values())
                };

                try {
                    const jsonData = JSON.stringify(locationData, null, 2);
                    const dataElement = `<data id="component-locations" type="application/json">${jsonData}</data>`;
                    
                    // Get the SVG element
                    const svgElement = document.querySelector('svg');
                    if (svgElement) {
                        // Check if data element already exists
                        const existingData = svgElement.querySelector('data[id="component-locations"]');
                        if (existingData) {
                            // Replace existing data element content
                            existingData.textContent = jsonData;
                        } else {
                            // Insert new data element before closing </svg> tag
                            svgElement.insertAdjacentHTML('beforeend', dataElement);
                        }
                        
                        console.log(`Updated SVG with ${this.locations.size} component locations`);
                    } else {
                        console.error('No SVG element found for saving locations');
                    }
                    
                    // Also save to server API for persistence
                    this.saveToServer(locationData);
                } catch (error) {
                    console.error(`Failed to save component locations to SVG: ${error}`);
                }
            }
            
            async saveToServer(locationData) {
                try {
                    // Extract schematic name from the page title or use a default
                    const title = document.title || 'schematic';
                    const schematicName = title.replace(' - KiCad Symbol Viewer', '').toLowerCase().replace(/[^a-z0-9]/g, '_');
                    
                    // Save updated SVG with new component positions
                    const svgElement = document.querySelector('svg');
                    if (svgElement) {
                        // Create a clean copy of the SVG without zoom transforms
                        const cleanSvg = svgElement.cloneNode(true);
                        
                        // Remove zoom transform group and move its children back to the main SVG
                        const transformGroup = cleanSvg.querySelector('#zoom-transform-group');
                        if (transformGroup) {
                            const children = Array.from(transformGroup.children);
                            children.forEach(child => {
                                cleanSvg.appendChild(child);
                            });
                            transformGroup.remove();
                        }
                        
                        // Reset zoom and pan to default values
                        cleanSvg.setAttribute('width', '2000');
                        cleanSvg.setAttribute('height', '1500');
                        
                        const updatedSvgContent = cleanSvg.outerHTML;
                        const svgResponse = await fetch(`/api/save-svg/${schematicName}`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({ svgContent: updatedSvgContent })
                        });
                        
                        if (svgResponse.ok) {
                            console.log('Updated SVG saved to server successfully');
                        } else {
                            console.warn('Failed to save updated SVG to server:', svgResponse.statusText);
                        }
                    }
                } catch (error) {
                    console.warn('Could not save to server:', error);
                }
            }

            generateSymbolHash(component, symbolContent) {
                // Create a hash based on the symbol content to detect when the symbol changes
                // This allows us to invalidate locations when the symbol definition changes
                const hashString = symbolContent || '';
                let hash = 0;
                for (let i = 0; i < hashString.length; i++) {
                    const char = hashString.charCodeAt(i);
                    hash = ((hash << 5) - hash) + char;
                    hash = hash & hash;
                }
                return hash.toString(16);
            }

            ensureComponentHasUUID(component) {
                if (!component._uuid) {
                    // Use only the reference for UUID generation to ensure consistency
                    // between saving and loading, regardless of symbol/footprint/value changes
                    const uuidString = component.reference;
                    let hash = 0;
                    for (let i = 0; i < uuidString.length; i++) {
                        const char = uuidString.charCodeAt(i);
                        hash = ((hash << 5) - hash) + char;
                        hash = hash & hash;
                    }
                    component._uuid = `comp_${hash.toString(16)}`;
                }
            }

            getLocation(component) {
                this.ensureComponentHasUUID(component);
                const location = this.locations.get(component._uuid);
                if (location) {
                    return { x: location.x, y: location.y, rotation: location.rotation || 0 };
                }
                return null;
            }

            setLocation(component, x, y, symbolContent, rotation = 0) {
                this.ensureComponentHasUUID(component);
                const symbolHash = this.generateSymbolHash(component, symbolContent);
                
                const location = {
                    uuid: component._uuid,
                    reference: component.reference,
                    x,
                    y,
                    rotation,
                    lastModified: Date.now(),
                    symbolHash
                };

                this.locations.set(component._uuid, location);
                this.saveLocations();
            }

            hasLocation(component) {
                this.ensureComponentHasUUID(component);
                return this.locations.has(component._uuid);
            }

            isLocationValid(component, symbolContent) {
                this.ensureComponentHasUUID(component);
                const location = this.locations.get(component._uuid);
                if (!location) return false;

                const currentHash = this.generateSymbolHash(component, symbolContent);
                return location.symbolHash === currentHash;
            }

            removeLocation(component) {
                this.ensureComponentHasUUID(component);
                this.locations.delete(component._uuid);
                this.saveLocations();
            }

            clearAllLocations() {
                this.locations.clear();
                this.saveLocations();
            }

            getLocationStats() {
                let valid = 0;
                let invalid = 0;

                this.locations.forEach(location => {
                    const ageInDays = (Date.now() - location.lastModified) / (1000 * 60 * 60 * 24);
                    if (ageInDays < 30) {
                        valid++;
                    } else {
                        invalid++;
                    }
                });

                return {
                    total: this.locations.size,
                    valid,
                    invalid
                };
            }

            // Reference text positioning methods
            setReferenceTextPosition(component, x, y) {
                this.ensureComponentHasUUID(component);
                
                const location = this.locations.get(component._uuid);
                if (location) {
                    // Update existing location with reference text position
                    location.referenceTextX = x;
                    location.referenceTextY = y;
                    location.lastModified = Date.now();
                } else {
                    // Create new location entry with just reference text position
                    const newLocation = {
                        uuid: component._uuid,
                        reference: component.reference,
                        x: 0, // Default component position
                        y: 0,
                        rotation: 0,
                        lastModified: Date.now(),
                        symbolHash: '',
                        referenceTextX: x,
                        referenceTextY: y
                    };
                    this.locations.set(component._uuid, newLocation);
                }
                
                this.saveLocations();
            }

            getReferenceTextPosition(component) {
                this.ensureComponentHasUUID(component);
                
                const location = this.locations.get(component._uuid);
                if (location && location.referenceTextX !== undefined && location.referenceTextY !== undefined) {
                    return { x: location.referenceTextX, y: location.referenceTextY };
                }
                return null;
            }

            updateSvgContent(svgContent) {
                // For browser implementation, we don't need to update SVG content string
                // since we're working directly with the DOM
                console.log('SVG content update requested (browser implementation)');
            }
        }
    </script>
    <style>
        :root {
            
            --schematic-background: #282828;
            --schematic-component-body: #32302f;
            --schematic-component-outline: #83a598;
            --schematic-pin: #689d6a;
            --schematic-pin-name: #d5c4a1;
            --schematic-pin-number: #fabd2f;
            --schematic-wire: #789d6a;
            --schematic-reference: #fbf1c7;
            --schematic-shadow: #fbf1c7;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            background-color: #f5f5f5;
        }
        #svg-container {
            width: 100%;
            height: 100vh;
            background: white;
            margin: 0;
            display: block;
            overflow: auto;
        }
        svg {
            display: block;
            cursor: crosshair;
        }
        svg.panning {
            cursor: grab;
        }
        svg.panning:active {
            cursor: grabbing;
        }
        svg.dragging {
            cursor: grabbing !important;
        }
        g[data-component] {
            cursor: grab;
        }
        .component-overlay {
            cursor: grab;
        }

        .connection-wire {
            transition: all 0.1s ease-out;
        }
        .connection-wire:hover {
            stroke-width: 4;
            filter: drop-shadow(0 0 3px var(--schematic-shadow));
        }
        .component-blocked {
            opacity: 0.5;
            filter: drop-shadow(0 0 8px red);
        }
        .component-dragging {
            opacity: 0.8;
            filter: drop-shadow(0 0 4px rgba(0, 0, 0, 0.3));
            cursor: grabbing !important;
        }
        .component-selected {
            /* No outline on the component group itself */
        }
        
        /* Highlight symbol body elements when component is selected */
        .component-selected rect:not(.component-overlay):not(.pin-connection-indicator) {
            stroke: var(--schematic-shadow, rgb(251, 241, 199));
            stroke-width: 2px;
        }
        
        .component-selected circle:not(.pin-connection-indicator) {
            stroke: var(--schematic-shadow, rgb(251, 241, 199));
            stroke-width: 2px;
        }
        
        .component-selected polyline {
            stroke: var(--schematic-shadow, rgb(251, 241, 199));
            stroke-width: 2px;
        }
        
        .component-selected line:not(.pin-connection-indicator) {
            stroke: var(--schematic-shadow, rgb(251, 241, 199));
            stroke-width: 2px;
        }
        
        /* Highlight all text elements within selected component */
        .component-selected text {
            stroke: var(--schematic-shadow, rgb(251, 241, 199));
            stroke-width: 1px;
            paint-order: stroke;
            stroke-linejoin: round;
        }
        
        /* Reference text selection styling - outline only */
        .reference-selected {
            stroke: var(--schematic-shadow, rgb(251, 241, 199));
            stroke-width: 2px;
            paint-order: stroke;
            stroke-linejoin: round;
        }
        

        

        
        /* Wire label styling - color will be set dynamically by JavaScript */
        .wire-label {
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 10px;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none; /* Labels don't interfere with interactions */
            font-weight: bold;
        }
        
        /* Make labels scale appropriately with zoom */
        .wire-label {
            transition: opacity 0.1s ease;
        }
        
        /* Ensure reference text is always visible on top */
        text[data-reference] {
            pointer-events: auto;
            cursor: grab;
            user-select: none;
        }
        
        text[data-reference]:hover {
            opacity: 0.8;
        }

        /* Fix for pin text elements that appear upside down when component is rotated 180 degrees */
        /* Target pin text elements inside components marked as rotated 180 degrees */
        g[data-component][data-rotated-180] .pin-name-text,
        g[data-component][data-rotated-180] .pin-number-text,
        g[data-component][data-rotated-180] .pin-name-text--overline {
            transform: scale(-1, -1);
            transform-origin: center;
            transform-box: fill-box;
        }

        /* Ensure overlines mirror with flipped text */
        g[data-component][data-rotated-180] .pin-name-overline {
            transform: scale(-1, -1);
            transform-origin: center;
            transform-box: fill-box;
        }

        /* Keep overline above text when flipped by using text-decoration and hiding the line */
        g[data-component][data-rotated-180] .pin-name-overline { display: none; }
        g[data-component][data-rotated-180] .pin-name-text--overline { text-decoration: overline; }

        /* Pure-CSS fallback: detect 180° via transform attribute on the component group */
        g[data-component][transform*="rotate(180"] .pin-name-text,
        g[data-component][transform*="rotate(180"] .pin-number-text,
        g[data-component][transform*="rotate(180"] .pin-name-overline,
        g[data-component][transform*="rotate(180"] .pin-name-text--overline,
        g[data-component][transform*="rotate(-180"] .pin-name-text,
        g[data-component][transform*="rotate(-180"] .pin-number-text,
        g[data-component][transform*="rotate(-180"] .pin-name-overline,
        g[data-component][transform*="rotate(-180"] .pin-name-text--overline {
            transform: scale(-1, -1);
            transform-origin: center;
            transform-box: fill-box;
        }

        /* Fallback for transform attribute detection */
        g[data-component][transform*="rotate(180"] .pin-name-overline { display: none; }
        g[data-component][transform*="rotate(180"] .pin-name-text--overline { text-decoration: overline; }
    </style>
</head>

        // Function to update grid rectangles to cover the proper area
        function updateGridRectangles() {

        // Function to apply zoom and pan transform to the SVG
        function applyZoomTransform() {
            // Create a transform group if it doesn't exist
            let transformGroup = svg.querySelector('#zoom-transform-group');
            if (!transformGroup) {
                transformGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                transformGroup.id = 'zoom-transform-group';
                
                // Move all content except defs and the transform group itself
                const children = Array.from(svg.children);
                children.forEach(child => {
                    if (child.tagName !== 'defs' && 
                        child.id !== 'zoom-transform-group') {
                        transformGroup.appendChild(child);
                    }
                });
                
                svg.appendChild(transformGroup);
            }
            
            // Apply transform to the group
            transformGroup.setAttribute('transform', `translate(${panX}, ${panY}) scale(${zoomLevel})`);
            
            // Update grid rectangles to cover the proper area
            updateGridRectangles();

            updateZoomDisplay();

        // Function to handle zoom with mouse wheel
        function handleWheel(event) {
            event.preventDefault();
            
            // Get mouse position relative to SVG container
            const rect = container.getBoundingClientRect();
            const mouseX = event.clientX - rect.left + container.scrollLeft;
            const mouseY = event.clientY - rect.top + container.scrollTop;
            
            // Calculate mouse position in SVG coordinates before zoom
            const svgX = (mouseX - panX) / zoomLevel;
            const svgY = (mouseY - panY) / zoomLevel;
            
            // Calculate new zoom level
            const zoomDirection = event.deltaY > 0 ? -1 : 1;
            const newZoomLevel = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoomLevel + (zoomDirection * ZOOM_STEP)));
            
            if (newZoomLevel !== zoomLevel) {
                // Calculate new pan to keep mouse position fixed
                const newPanX = mouseX - svgX * newZoomLevel;
                const newPanY = mouseY - svgY * newZoomLevel;
                
                // Update zoom and pan
                zoomLevel = newZoomLevel;
                panX = newPanX;
                panY = newPanY;
                
                // Apply the transform
                applyZoomTransform();
                
                // Update wire connections after zoom
                updateWires();
                
                // Update component overlays after zoom
                addComponentOverlays();
            }
        }

        function doPanning(event) {

            }
            
            const dx = event.clientX - panStartX;
            const dy = event.clientY - panStartY;
            
            panX = panInitialX + dx;
            panY = panInitialY + dy;
            
            applyZoomTransform();
            event.preventDefault();

        function stopPanning(event) {

        // Function to detect if a line segment intersects with a pin (circular area around pin)
        function lineIntersectsPin(lineStart, lineEnd, pinPos, pinRadius = 8) {
            // Skip if the pin is at the exact same position as start or end (it's one of the connection endpoints)
            const tolerance = 0.1;
            if ((Math.abs(pinPos.x - lineStart.x) < tolerance && Math.abs(pinPos.y - lineStart.y) < tolerance) ||
                (Math.abs(pinPos.x - lineEnd.x) < tolerance && Math.abs(pinPos.y - lineEnd.y) < tolerance)) {
                return false;
            }
            
            // Distance from point to line segment
            const A = lineEnd.x - lineStart.x;
            const B = lineEnd.y - lineStart.y;
            const C = pinPos.x - lineStart.x;
            const D = pinPos.y - lineStart.y;
            
            const dot = C * A + D * B;
            const lenSq = A * A + B * B;
            
            if (lenSq === 0) return false; // Line has zero length
            
            const param = dot / lenSq;
            
            let xx, yy;
            if (param < 0) {
                xx = lineStart.x;
                yy = lineStart.y;
            } else if (param > 1) {
                xx = lineEnd.x;
                yy = lineEnd.y;
            } else {
                xx = lineStart.x + param * A;
                yy = lineStart.y + param * B;
            }
            
            const dx = pinPos.x - xx;
            const dy = pinPos.y - yy;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            return distance <= pinRadius;
        }
        
        // Function to get all pin positions for overlap detection
        function getAllPinPositions() {
            const allPins = [];
            pinPositions.forEach((pinData, pinKey) => {
                const [reference, pinNumber] = pinKey.split('_');
                const component = svg.querySelector(`g[data-component="${reference}"]`);
                if (component) {
                    const transform = component.getAttribute('transform') || 'translate(0, 0)';
                    // Parse transform using string methods
                    let currentOffset = { x: 0, y: 0 };
                    let rotation = 0;
                    
                    // Parse translate
                    if (transform.includes('translate(')) {
                        const start = transform.indexOf('translate(') + 10;
                        const end = transform.indexOf(')', start);
                        const coords = transform.substring(start, end).split(',');
                        if (coords.length === 2) {
                            currentOffset = { 
                                x: parseFloat(coords[0].trim()), 
                                y: parseFloat(coords[1].trim()) 
                            };
                        }
                    }
                    
                    // Parse rotation
                    if (transform.includes('rotate(')) {
                        const rotateStart = transform.indexOf('rotate(') + 7;
                        const rotateEnd = transform.indexOf(')', rotateStart);
                        const rotateValue = transform.substring(rotateStart, rotateEnd).trim();
                        const rotationParts = rotateValue.split(' ');
                        if (rotationParts.length >= 1) {
                            rotation = parseFloat(rotationParts[0]) || 0;
                            // rotationParts[1] and [2] are centerX and centerY if specified
                        }
                    }
                    
                    // Calculate pin position with rotation applied
                    let pinX = pinData.localX;
                    let pinY = pinData.localY;
                    
                    // Apply rotation if component is rotated
                    if (rotation !== 0) {
                        // Parse rotation center from the transform (if specified)
                        let rotationCenterX = 0;
                        let rotationCenterY = 0;
                        
                        // The rotation center is specified in the SVG transform as "rotate(angle centerX centerY)"
                        // If not specified, rotation is around the component center (0,0)
                        if (transform.includes('rotate(')) {
                            const rotateStart = transform.indexOf('rotate(') + 7;
                            const rotateEnd = transform.indexOf(')', rotateStart);
                            const rotateValue = transform.substring(rotateStart, rotateEnd).trim();
                            const rotationParts = rotateValue.split(' ');
                            if (rotationParts.length >= 3) {
                                rotationCenterX = parseFloat(rotationParts[1]) || 0;
                                rotationCenterY = parseFloat(rotationParts[2]) || 0;
                            }
                            // If only one value (angle), center is (0,0) - no need to change defaults
                        }
                        
                        // Convert rotation to radians
                        const radians = (rotation * Math.PI) / 180;
                        
                        // Translate pin to rotation center origin
                        const relativeX = pinX - rotationCenterX;
                        const relativeY = pinY - rotationCenterY;
                        
                        // Apply 2D rotation matrix
                        const rotatedX = relativeX * Math.cos(radians) - relativeY * Math.sin(radians);
                        const rotatedY = relativeX * Math.sin(radians) + relativeY * Math.cos(radians);
                        
                        // Translate back to final position
                        pinX = rotatedX + rotationCenterX;
                        pinY = rotatedY + rotationCenterY;
                    }
                    
                    // Add component offset
                    pinX += currentOffset.x;
                    pinY += currentOffset.y;
                    
                    allPins.push({
                        x: pinX,
                        y: pinY,
                        ref: reference,
                        pin: pinNumber
                    });
                }
            });
            return allPins;
        }
        
        // Function to create a bezier curve that avoids pin overlaps
        function createAvoidancePath(startPin, endPin, obstaclePins) {
            const start = { x: startPin.x, y: startPin.y };
            const end = { x: endPin.x, y: endPin.y };
            
            // Check if direct line intersects any obstacle pins
            const directLineIntersects = obstaclePins.some(pin => 
                lineIntersectsPin(start, end, pin)
            );
            
            if (!directLineIntersects) {
                // No obstacles, use straight line
                return null;
            }
            
            // Calculate bezier control points to route around obstacles
            const midX = (start.x + end.x) / 2;
            const midY = (start.y + end.y) / 2;
            
            // Determine direction to offset the curve
            const dx = end.x - start.x;
            const dy = end.y - start.y;
            const length = Math.sqrt(dx * dx + dy * dy);
            
            if (length === 0) return null;
            
            // Perpendicular vector for offset
            const perpX = -dy / length;
            const perpY = dx / length;
            
            // Try different offset distances to find a clear path
            const offsets = [30, 50, 80, 120]; // Increasing offset distances
            
            for (const offset of offsets) {
                const controlX = midX + perpX * offset;
                const controlY = midY + perpY * offset;
                
                // Check if this curved path avoids obstacles
                const curvePoints = getBezierPoints(start, { x: controlX, y: controlY }, end, 20);
                let pathClear = true;
                
                for (let i = 0; i < curvePoints.length - 1; i++) {
                    if (obstaclePins.some(pin => 
                        lineIntersectsPin(curvePoints[i], curvePoints[i + 1], pin)
                    )) {
                        pathClear = false;
                        break;
                    }
                }
                
                if (pathClear) {
                    return { x: controlX, y: controlY };
                }
                
                // Try the opposite direction
                const controlX2 = midX - perpX * offset;
                const controlY2 = midY - perpY * offset;
                
                const curvePoints2 = getBezierPoints(start, { x: controlX2, y: controlY2 }, end, 20);
                pathClear = true;
                
                for (let i = 0; i < curvePoints2.length - 1; i++) {
                    if (obstaclePins.some(pin => 
                        lineIntersectsPin(curvePoints2[i], curvePoints2[i + 1], pin)
                    )) {
                        pathClear = false;
                        break;
                    }
                }
                
                if (pathClear) {
                    return { x: controlX2, y: controlY2 };
                }
            }
            
            // If all attempts fail, use a larger offset as fallback
            return { x: midX + perpX * 150, y: midY + perpY * 150 };
        }
        
        // Function to get points along a quadratic bezier curve
        function getBezierPoints(start, control, end, numPoints) {
            const points = [];
            for (let i = 0; i <= numPoints; i++) {
                const t = i / numPoints;
                const x = (1 - t) * (1 - t) * start.x + 2 * (1 - t) * t * control.x + t * t * end.x;
                const y = (1 - t) * (1 - t) * start.y + 2 * (1 - t) * t * control.y + t * t * end.y;
                points.push({ x, y });
            }
            return points;
        }

        // Function to calculate distance between two points
        function calculateDistance(pin1, pin2) {
            const dx = pin2.x - pin1.x;
            const dy = pin2.y - pin1.y;
            return Math.sqrt(dx * dx + dy * dy);
        }

        // Function to find closest point connections using minimum spanning tree
        function findClosestPinConnections(connectedPins) {
            if (connectedPins.length <= 1) return [];

            const connections = [];
            const connected = new Set();
            
            // Start with the first pin
            connected.add(0);
            
            // Build minimum spanning tree using closest point algorithm
            while (connected.size < connectedPins.length) {
                let minDistance = Infinity;
                let bestConnection = null;
                
                // Find the closest unconnected pin to any connected pin
                for (const connectedIndex of connected) {
                    for (let i = 0; i < connectedPins.length; i++) {
                        if (!connected.has(i)) {
                            const distance = calculateDistance(connectedPins[connectedIndex], connectedPins[i]);
                            if (distance < minDistance) {
                                minDistance = distance;
                                bestConnection = {from: connectedIndex, to: i};
                            }
                        }
                    }
                }
                
                if (bestConnection) {
                    connections.push(bestConnection);
                    connected.add(bestConnection.to);
                } else {
                    break; // Safety break if no connection found
                }
            }
            
            return connections;
        }

                                // The rotation center is specified in the SVG transform as "rotate(angle centerX centerY)"
                                // If not specified, rotation is around the component center (0,0)
                                if (transform.includes('rotate(')) {

                                }

                                const relativeX = pinX - rotationCenterX;

                                // Apply 2D rotation matrix
