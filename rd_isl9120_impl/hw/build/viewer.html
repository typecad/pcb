                            transformGroup.appendChild(path);
                            
                            // Add wire name label if netName is not empty
                            console.log(`HTML Viewer bezier - Checking netName: "${connection.netName}"`);
                            if (connection.netName && connection.netName.trim() !== '') {
                                // For bezier curves, place the label at the midpoint (t=0.5)
                                const t = 0.5;
                                const labelX = (1 - t) * (1 - t) * startPin.x + 2 * (1 - t) * t * controlPoint.x + t * t * endPin.x;
                                const labelY = (1 - t) * (1 - t) * startPin.y + 2 * (1 - t) * t * controlPoint.y + t * t * endPin.y;
                                
                                // Calculate tangent angle at midpoint for text rotation
                                const tangentX = 2 * (1 - t) * (controlPoint.x - startPin.x) + 2 * t * (endPin.x - controlPoint.x);
                                const tangentY = 2 * (1 - t) * (controlPoint.y - startPin.y) + 2 * t * (endPin.y - controlPoint.y);
                                const angle = Math.atan2(tangentY, tangentX) * 180 / Math.PI;
                                
                                // Normalize angle to be readable (not upside down)
                                const normalizedAngle = (angle > 90 || angle < -90) ? angle + 180 : angle;
                                
                                const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                                label.setAttribute('x', labelX);
                                label.setAttribute('y', labelY - 8);
                                label.setAttribute('font-family', 'Consolas, Monaco, Courier New, monospace');
                                label.setAttribute('font-size', '14');
                                label.setAttribute('fill', themeColors?.labelLocal || '#000000');
                                label.setAttribute('text-anchor', 'middle');
                                label.setAttribute('dominant-baseline', 'central');
                                label.setAttribute('transform', `rotate(${normalizedAngle} ${labelX} ${labelY})`);
                                label.setAttribute('class', 'wire-label');
                                label.textContent = connection.netName;
                                
                                transformGroup.appendChild(label);
                                console.log(`Added bezier label: "${connection.netName}"`);
                            }
                            
                            console.log(`Bezier curve: "${connection.netName}" from ${startPin.ref}:${startPin.pin} to ${endPin.ref}:${endPin.pin} (closest point)`);
                        } else {
                            // No obstacles, use straight line
                            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                            line.setAttribute('x1', startPin.x);
                            line.setAttribute('y1', startPin.y);
                            line.setAttribute('x2', endPin.x);
                            line.setAttribute('y2', endPin.y);
                            line.setAttribute('stroke', themeColors?.wire || '#FF6B6B');
                            line.setAttribute('stroke-width', '3');
                            line.setAttribute('stroke-linecap', 'round');
                            line.setAttribute('data-net', connection.netName);
                            line.setAttribute('class', 'connection-wire');
                            line.setAttribute('title', `Net: ${connection.netName} (direct connection)`);
                            
                            transformGroup.appendChild(line);
                            
                            // Add wire name label if netName is not empty
                            console.log(`HTML Viewer line - Checking netName: "${connection.netName}"`);
                            if (connection.netName && connection.netName.trim() !== '') {
                                const midX = (startPin.x + endPin.x) / 2;
                                const midY = (startPin.y + endPin.y) / 2;
                                
                                // Calculate text angle to align with wire
                                const dx = endPin.x - startPin.x;
                                const dy = endPin.y - startPin.y;
                                const angle = Math.atan2(dy, dx) * 180 / Math.PI;
                                
                                // Normalize angle to be readable (not upside down)
                                const normalizedAngle = (angle > 90 || angle < -90) ? angle + 180 : angle;
                                
                                const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                                label.setAttribute('x', midX);
                                label.setAttribute('y', midY - 5);
                                label.setAttribute('font-family', 'Consolas, Monaco, Courier New, monospace');
                                label.setAttribute('font-size', '14');
                                label.setAttribute('fill', themeColors?.labelLocal || '#000000');
                                label.setAttribute('text-anchor', 'middle');
                                label.setAttribute('dominant-baseline', 'central');
                                label.setAttribute('transform', `rotate(${normalizedAngle} ${midX} ${midY})`);
                                label.setAttribute('class', 'wire-label');
                                label.textContent = connection.netName;
                                
                                transformGroup.appendChild(label);
                                console.log(`Added line label: "${connection.netName}"`);
                            }
                            
                            console.log(`Direct line: "${connection.netName}" from ${startPin.ref}:${startPin.pin} to ${endPin.ref}:${endPin.pin} (closest point)`);
                        }
                    }
                }
            });
        }

        // Function to check if a pin position would overlap with another pin
        function checkPinOverlaps(componentRef, newOffset) {
            const overlaps = [];
            const pinRadius = 8; // Same radius used for wire collision detection
            
            // Get all pins for the component being moved
            const componentPins = [];
            pinPositions.forEach((pinData, pinKey) => {
                if (pinKey.startsWith(componentRef + '_')) {
                    const pinX = pinData.localX + newOffset.x;
                    const pinY = pinData.localY + newOffset.y;
                    componentPins.push({
                        key: pinKey,
                        x: pinX,
                        y: pinY,
                        ref: componentRef,
                        pin: pinKey.split('_')[1]
                    });
                }
            });
            
            // Check against all other pins in the design
            pinPositions.forEach((otherPinData, otherPinKey) => {
                if (!otherPinKey.startsWith(componentRef + '_')) {
                    // Get the other component's current position
                    const [otherRef] = otherPinKey.split('_');
                    const otherComponent = svg.querySelector(`g[data-component="${otherRef}"]`);
                    let otherOffset = { x: 0, y: 0 };
                    
                    if (otherComponent) {
                        const transform = otherComponent.getAttribute('transform') || 'translate(0, 0)';
                        // Parse transform using string methods
                        otherOffset = { x: 0, y: 0 };
                        if (transform.includes('translate(')) {
                            const start = transform.indexOf('translate(') + 10;
                            const end = transform.indexOf(')', start);
                            const coords = transform.substring(start, end).split(',');
                            if (coords.length === 2) {
                                otherOffset = { 
                                    x: parseFloat(coords[0].trim()), 
                                    y: parseFloat(coords[1].trim()) 
                                };
                            }
                        }
                    }
                    
                    const otherPinX = otherPinData.localX + otherOffset.x;
                    const otherPinY = otherPinData.localY + otherOffset.y;
                    
                    // Check each pin of the moving component against this other pin
                    for (const componentPin of componentPins) {
                        const distance = Math.sqrt(
                            Math.pow(componentPin.x - otherPinX, 2) + 
                            Math.pow(componentPin.y - otherPinY, 2)
                        );
                        
                        if (distance < pinRadius * 2) { // Two pin radii = minimum distance
                            overlaps.push({
                                movingPin: componentPin,
                                conflictPin: {
                                    key: otherPinKey,
                                    x: otherPinX,
                                    y: otherPinY,
                                    ref: otherRef,
                                    pin: otherPinKey.split('_')[1]
                                },
                                distance: distance
                            });
                        }
                    }
                }
            });
            
            return overlaps;
        }
        
        // Function to check if two pins are connected in the same net
        function arePinsConnected(pin1Key, pin2Key) {
            for (const connection of connectionsData) {
                const pinKeys = connection.pins.map(p => `${p.reference}_${p.pinNumber}`);
                if (pinKeys.includes(pin1Key) && pinKeys.includes(pin2Key)) {
                    return true;
                }
            }
            return false;
        }
        
        // Function to filter overlaps to only show those that are not allowed
        function getBlockingOverlaps(overlaps) {
            return overlaps.filter(overlap => {
                const movingPinKey = overlap.movingPin.key;
                const conflictPinKey = overlap.conflictPin.key;
                return !arePinsConnected(movingPinKey, conflictPinKey);
            });
        }

        // Function to check if component bounding boxes would overlap
        function checkComponentOverlaps(componentRef, newOffset) {
            const movingComponent = svg.querySelector(`g[data-component="${componentRef}"]`);
            if (!movingComponent) return [];
            
            // Add tolerance to allow components to get closer together
            // This represents how much the collision area is shrunk from each side
            const collisionTolerance = 10; // pixels - adjust this to control how close components can get
            
            // Calculate the bounding box of the moving component at the new position
            const movingBBox = movingComponent.getBBox();
            const movingBounds = {
                left: movingBBox.x + newOffset.x + collisionTolerance,
                right: Math.max(movingBBox.x + newOffset.x + collisionTolerance + 1, movingBBox.x + movingBBox.width + newOffset.x - collisionTolerance),
                top: movingBBox.y + newOffset.y + collisionTolerance,
                bottom: Math.max(movingBBox.y + newOffset.y + collisionTolerance + 1, movingBBox.y + movingBBox.height + newOffset.y - collisionTolerance)
            };
            
            const overlaps = [];
            
            // Check against all other components
            const allComponents = svg.querySelectorAll('g[data-component]');
            allComponents.forEach(otherComponent => {
                const otherRef = otherComponent.getAttribute('data-component');
                if (otherRef === componentRef) return; // Skip self
                
                // Get the current position of the other component
                const otherTransform = otherComponent.getAttribute('transform') || 'translate(0, 0)';
                // Parse transform using string methods
                let otherOffset = { x: 0, y: 0 };
                if (otherTransform.includes('translate(')) {
                    const start = otherTransform.indexOf('translate(') + 10;
                    const end = otherTransform.indexOf(')', start);
                    const coords = otherTransform.substring(start, end).split(',');
                    if (coords.length === 2) {
                        otherOffset = { 
                            x: parseFloat(coords[0].trim()), 
                            y: parseFloat(coords[1].trim()) 
                        };
                    }
                }
                
                // Calculate the bounding box of the other component with same tolerance
                const otherBBox = otherComponent.getBBox();
                const otherBounds = {
                    left: otherBBox.x + otherOffset.x + collisionTolerance,
                    right: Math.max(otherBBox.x + otherOffset.x + collisionTolerance + 1, otherBBox.x + otherBBox.width + otherOffset.x - collisionTolerance),
                    top: otherBBox.y + otherOffset.y + collisionTolerance,
                    bottom: Math.max(otherBBox.y + otherOffset.y + collisionTolerance + 1, otherBBox.y + otherBBox.height + otherOffset.y - collisionTolerance)
                };
                
                // Check for bounding box overlap
                const isOverlapping = !(
                    movingBounds.right <= otherBounds.left ||
                    movingBounds.left >= otherBounds.right ||
                    movingBounds.bottom <= otherBounds.top ||
                    movingBounds.top >= otherBounds.bottom
                );
                
                if (isOverlapping) {
                    overlaps.push({
                        movingComponent: componentRef,
                        conflictComponent: otherRef,
                        movingBounds: movingBounds,
                        otherBounds: otherBounds
                    });
                }
            });
            
            return overlaps;
        }

        function makeDraggable(g) {
            let isDragging = false;
            let hasDragged = false; // Track if actual dragging occurred
            let startX, startY;
            let initialTransform = { x: 0, y: 0 };
            const gridSize = 25.4; // 2.54mm grid spacing
            const dragThreshold = 5; // Minimum distance to consider it a drag
            
            // Helper function to snap to grid
            const snapToGrid = (value) => {
                return Math.round(value / gridSize) * gridSize;
            };

            g.addEventListener('mousedown', (e) => {
                // Only allow dragging with left mouse button (button 0)
                if (e.button !== 0) {
                    return;
                }
                
                e.preventDefault();
                e.stopPropagation(); // Prevent event bubbling
                
                // Stop any active panning when starting component drag
                if (isPanning) {
                    isPanning = false;
                    svg.classList.remove('panning');
                }
                
                isDragging = true;
                hasDragged = false;
                startX = e.clientX;
                startY = e.clientY;
                
                                // Set cursor to grabbing immediately when starting drag
                document.body.style.cursor = 'grabbing';
                svg.classList.add('dragging');
                
                const transform = g.getAttribute('transform') || 'translate(0, 0)';
                // Parse transform to extract current position (not rotation)
                if (transform.includes('translate(')) {
                    const start = transform.indexOf('translate(') + 10;
                    const end = transform.indexOf(')', start);
                    if (start !== -1 && end !== -1) {
                        const coords = transform.substring(start, end).split(',');
                        if (coords.length === 2) {
                            const x = parseFloat(coords[0].trim());
                            const y = parseFloat(coords[1].trim());
                            if (!isNaN(x) && !isNaN(y)) {
                                initialTransform = { x, y };
                                
                                // Store the symbol's original position in the reference text element
                                const componentRef = g.getAttribute('data-component');
                                if (componentRef) {
                                    const referenceTextElement = svg.querySelector(`text[data-reference="${componentRef}"]`);
                                    if (referenceTextElement) {
                                        referenceTextElement._symbolOriginalX = x;
                                        referenceTextElement._symbolOriginalY = y;
                                    }
                                }
                            }
                        }
                    }
                }
                
                // Bring dragged element to front
                g.parentNode.appendChild(g);
            });

            document.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    e.preventDefault();
                    const dx = (e.clientX - startX) / zoomLevel;
                    const dy = (e.clientY - startY) / zoomLevel;
                    
                    // Check if we've moved enough to consider this a drag
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance > dragThreshold && !hasDragged) {
                        hasDragged = true;
                        // Add dragging visual feedback only when actual dragging starts
                        g.classList.add('component-dragging');
                        // Ensure cursor is grabbing during drag
                        document.body.style.cursor = 'grabbing';
                    }
                    
                    // Only move component if we've exceeded drag threshold
                    if (hasDragged) {
                        // Calculate new position and snap to grid
                        const newX = snapToGrid(initialTransform.x + dx);
                        const newY = snapToGrid(initialTransform.y + dy);
                        const newOffset = { x: newX, y: newY };
                        
                        // Get component reference from data attribute
                        const componentRef = g.getAttribute('data-component');
                        
                        // Check for pin overlaps at the new position
                        const pinOverlaps = checkPinOverlaps(componentRef, newOffset);
                        const blockingPinOverlaps = getBlockingOverlaps(pinOverlaps);
                        
                        // Check for component bounding box overlaps
                        const componentOverlaps = checkComponentOverlaps(componentRef, newOffset);
                        
                        if (blockingPinOverlaps.length > 0 || componentOverlaps.length > 0) {
                            // Overlap detected - prevent movement and show visual feedback
                            g.classList.add('component-blocked');
                            g.classList.remove('component-dragging');
                            
                            // Log the overlap for debugging
                            if (blockingPinOverlaps.length > 0) {
                                const firstOverlap = blockingPinOverlaps[0];
                                console.log(`Pin overlap prevented: ${firstOverlap.movingPin.ref}:${firstOverlap.movingPin.pin} would overlap ${firstOverlap.conflictPin.ref}:${firstOverlap.conflictPin.pin}`);
                            }
                            if (componentOverlaps.length > 0) {
                                const firstOverlap = componentOverlaps[0];
                                console.log(`Component overlap prevented: ${firstOverlap.movingComponent} would overlap ${firstOverlap.conflictComponent}`);
                            }
                            
                            // Don't update position - keep component at last valid position
                            return;
                        } else {
                            // No blocking overlaps - allow movement and clear visual feedback
                            g.classList.remove('component-blocked');
                            g.classList.add('component-dragging');
                            
                            // Preserve existing rotation when updating position
                            const currentTransform = g.getAttribute('transform') || 'translate(0, 0)';
                            let existingRotation = '';
                            
                            // Extract existing rotation if present
                            if (currentTransform.includes('rotate(')) {
                                const rotateStart = currentTransform.indexOf('rotate(');
                                const rotateEnd = currentTransform.indexOf(')', rotateStart) + 1;
                                existingRotation = ' ' + currentTransform.substring(rotateStart, rotateEnd);
                            }
                            
                            // Apply new position while preserving rotation
                            g.setAttribute('transform', `translate(${newX}, ${newY})${existingRotation}`);
                            
                            // Move the associated reference text by the same amount
                            moveReferenceTextWithSymbol(componentRef, newOffset);
                            
                            // Update wires in real-time
                            updateWires();
                            
                            // Update component overlays after movement
                            addComponentOverlays();
                        }
                    }
                }
            });

            document.addEventListener('mouseup', (e) => {
                if (isDragging) {
                    e.preventDefault();
                    e.stopPropagation();
                    
                    // Store the hasDragged state before resetting
                    const actuallyDragged = hasDragged;
                    
                    // If we didn't actually drag, treat this as a selection click
                    if (!actuallyDragged) {
                        selectComponent(g);
                    }
                    
                    isDragging = false;
                    
                    // Clear any visual feedback when dragging ends
                    g.classList.remove('component-dragging', 'component-blocked');
                    
                    // Reset cursor to default when dragging ends
                    document.body.style.cursor = '';
                    svg.classList.remove('dragging');
                    
                    // Only save position if we actually dragged
                    if (actuallyDragged) {
                        // Save the final position and rotation
                        const componentRef = g.getAttribute('data-component');
                        const transform = g.getAttribute('transform') || 'translate(0, 0)';
                        // Parse transform using string methods
                        let finalPosition = { x: 0, y: 0 };
                        let finalRotation = 0;
                        console.log('Parsing transform for', componentRef, ':', transform);
                        
                        // Parse translate
                        if (transform.includes('translate(')) {
                            const start = transform.indexOf('translate(') + 10;
                            const end = transform.indexOf(')', start);
                            const coords = transform.substring(start, end).split(',');
                            console.log('Found coordinates:', coords);
                            if (coords.length === 2) {
                                const x = parseFloat(coords[0].trim());
                                const y = parseFloat(coords[1].trim());
                                if (!isNaN(x) && !isNaN(y)) {
                                    finalPosition = { x, y };
                                    console.log('Parsed position:', finalPosition);
                                } else {
                                    console.error('Invalid coordinates:', coords[0], coords[1]);
                                }
                            } else {
                                console.error('Expected 2 coordinates, found:', coords.length);
                            }
                        } else {
                            console.log('No translate found in transform:', transform);
                        }
                        
                        // Parse rotate
                        if (transform.includes('rotate(')) {
                            const rotateStart = transform.indexOf('rotate(') + 7;
                            const rotateEnd = transform.indexOf(')', rotateStart);
                            const rotateValue = transform.substring(rotateStart, rotateEnd).trim();
                            const rotationParts = rotateValue.split(' ');
                            if (rotationParts.length >= 1) {
                                finalRotation = parseFloat(rotationParts[0]) || 0;
                                console.log('Parsed rotation:', finalRotation);
                            }
                        }
                        
                        // Create a component object for the location manager
                        const component = {
                            reference: componentRef,
                            symbol: 'unknown', // We don't have this info in the viewer
                            footprint: 'unknown', // We don't have this info in the viewer
                            value: 'unknown' // We don't have this info in the viewer
                        };
                        
                        // Save the location and rotation (synchronous for embedded storage)
                        if (finalPosition && typeof finalPosition.x === 'number' && typeof finalPosition.y === 'number') {
                            try {
                                locationManager.setLocation(component, finalPosition.x, finalPosition.y, 'viewer-position', finalRotation);
                                console.log(`Saved position for ${componentRef}: (${finalPosition.x}, ${finalPosition.y}) rotation: ${finalRotation}°`);
                                
                                // Also save the reference text position
                                const referenceTextElement = svg.querySelector(`text[data-reference="${componentRef}"]`);
                                if (referenceTextElement) {
                                    const referenceX = parseFloat(referenceTextElement.getAttribute('x')) || 0;
                                    const referenceY = parseFloat(referenceTextElement.getAttribute('y')) || 0;
                                    locationManager.setReferenceTextPosition(component, referenceX, referenceY);
                                    console.log(`Saved reference text position for ${componentRef}: (${referenceX}, ${referenceY})`);
                                }
                                
                                // Note: Automatic saving disabled to prevent unwanted saves of selected components
                                // Manual save can be triggered if needed
                            } catch (error) {
                                console.error('Failed to save location:', error);
                            }
                        } else {
                            console.error('Invalid final position for component', componentRef, ':', finalPosition);
                        }
                        
                        // Clear symbol drag base positions for reference text to ensure fresh tracking next time
                        const referenceTextElement = svg.querySelector(`text[data-reference="${componentRef}"]`);
                        if (referenceTextElement) {
                            delete referenceTextElement._symbolDragBaseX;
                            delete referenceTextElement._symbolDragBaseY;
                            delete referenceTextElement._symbolOriginalX;
                            delete referenceTextElement._symbolOriginalY;
                        }
                    }
                    
                    // Reset hasDragged after all processing is complete
                    hasDragged = false;
                }
            });
        }

        // Function to add invisible overlay rectangles to make components fully grabbable
        function addComponentOverlays() {
            const components = svg.querySelectorAll('g[data-component]');
            components.forEach(component => {
                // Skip if overlay already exists
                if (component.querySelector('.component-overlay')) {
                    return;
                }
                
                // Calculate bounding box of the component
                const bbox = component.getBBox();
                
                // Add some padding to make it easier to grab
                const padding = 5;
                const overlayX = bbox.x - padding;
                const overlayY = bbox.y - padding;
                const overlayWidth = bbox.width + (padding * 2);
                const overlayHeight = bbox.height + (padding * 2);
                
                // Create invisible overlay rectangle
                const overlay = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                overlay.setAttribute('x', overlayX.toString());
                overlay.setAttribute('y', overlayY.toString());
                overlay.setAttribute('width', overlayWidth.toString());
                overlay.setAttribute('height', overlayHeight.toString());
                overlay.setAttribute('fill', 'transparent');
                overlay.setAttribute('stroke', 'none');
                overlay.setAttribute('class', 'component-overlay');
                overlay.setAttribute('cursor', 'grab');
                
                // Insert overlay as the first child so it's behind visual elements but still clickable
                component.insertBefore(overlay, component.firstChild);
            });
        }

        // Function to ensure reference text is always on the topmost layer
        function ensureReferenceTextOnTop() {
            // Find all reference text elements
            const referenceTexts = svg.querySelectorAll('text[data-reference]');
            
            // Move each reference text to the end of its parent container to appear on top
            referenceTexts.forEach(textElement => {
                const parent = textElement.parentNode;
                if (parent) {
                    // Remove and re-append to move to the end (topmost layer)
                    parent.removeChild(textElement);
                    parent.appendChild(textElement);
                }
            });
        }

        // Make reference text draggable
        function makeReferenceTextDraggable(textElement) {
            let isDragging = false;
            let hasDragged = false;
            let startX, startY;
            let initialPosition = { x: 0, y: 0 };
            const gridSize = 25.4; // 2.54mm grid spacing
            const dragThreshold = 5;
            
            // Helper function to snap to grid
            const snapToGrid = (value) => {
                return Math.round(value / gridSize) * gridSize;
            };

            textElement.addEventListener('mousedown', (e) => {
                if (e.button !== 0) return; // Only left mouse button
                
                e.preventDefault();
                e.stopPropagation();
                
                // Stop any active panning
                if (isPanning) {
                    isPanning = false;
                    svg.classList.remove('panning');
                }
                
                isDragging = true;
                hasDragged = false;
                startX = e.clientX;
                startY = e.clientY;

                // Get current position
                const currentX = parseFloat(textElement.getAttribute('x')) || 0;
                const currentY = parseFloat(textElement.getAttribute('y')) || 0;
                initialPosition = { x: currentX, y: currentY };
                
                // Visual feedback
                textElement.style.cursor = 'grabbing';
                textElement.style.opacity = '0.7';
                // Set document cursor to grabbing for consistency
                document.body.style.cursor = 'grabbing';
                svg.classList.add('dragging');
            });

            document.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    e.preventDefault();
                    const dx = (e.clientX - startX) / zoomLevel;
                    const dy = (e.clientY - startY) / zoomLevel;
                    
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance > dragThreshold && !hasDragged) {
                        hasDragged = true;
                    }
                    
                    if (hasDragged) {
                        // Calculate new position and snap to grid
                        const newX = snapToGrid(initialPosition.x + dx);
                        const newY = snapToGrid(initialPosition.y + dy);
                        
                        // Update position
                        textElement.setAttribute('x', newX.toString());
                        textElement.setAttribute('y', newY.toString());
                    }
                }
            });

            document.addEventListener('mouseup', async (e) => {
                if (isDragging) {
                    e.preventDefault();
                    e.stopPropagation();
                    
                    const actuallyDragged = hasDragged;
                    isDragging = false;
                    
                    // Reset visual feedback
                    textElement.style.cursor = 'grab';
                    textElement.style.opacity = '1';
                    // Reset document cursor
                    svg.classList.remove('dragging');
                    document.body.style.cursor = '';
                    
                    if (actuallyDragged) {
                        // Save the new position
                        const componentRef = textElement.getAttribute('data-reference');
                        const finalX = parseFloat(textElement.getAttribute('x'));
                        const finalY = parseFloat(textElement.getAttribute('y'));
                        
                        // Update the original position tracking for this reference text
                        // This ensures that future symbol movements will use the correct baseline
                        textElement._originalX = finalX;
                        textElement._originalY = finalY;
                        
                        // Create component object for location manager
                        const component = {
                            reference: componentRef,
                            symbol: 'unknown',
                            footprint: 'unknown',
                            value: 'unknown'
                        };
                        
                        // Save reference text position
                        try {
                            locationManager.setReferenceTextPosition(component, finalX, finalY);
                            console.log(`Saved reference text position for ${componentRef}: (${finalX}, ${finalY})`);
                            
                            // Update the SVG content in the ComponentLocationManager with current DOM state
                            const currentSvg = getSvg();
                            if (currentSvg) {
                                // Get the current SVG content and update the location manager
                                const updatedSvgContent = currentSvg.outerHTML;
                                locationManager.updateSvgContent(updatedSvgContent);
                                
                                // Save the updated SVG to server
                                await saveUpdatedSvgToServer();
                            }
                        } catch (error) {
                            console.error('Failed to save reference text position:', error);
                        }
                    }
                    
                    hasDragged = false;
                }
            });
        }

        // Make all components draggable
        function initializeDragging() {
            const components = svg.querySelectorAll('g[data-component]');
            components.forEach(component => {
                makeDraggable(component);
            });
            
            // Make all reference text elements draggable
            const referenceTexts = svg.querySelectorAll('text[data-reference]');
            referenceTexts.forEach(textElement => {
                makeReferenceTextDraggable(textElement);
                // Set cursor style for reference text
                textElement.style.cursor = 'grab';
                textElement.style.userSelect = 'none'; // Prevent text selection
            });
            
            // Add invisible overlays to make components fully grabbable
            addComponentOverlays();
            
            // Ensure reference text is on the topmost layer
            ensureReferenceTextOnTop();
            
            // Initialize zoom transform
            applyZoomTransform();
            
            console.log(`Initialized dragging for ${components.length} components and ${referenceTexts.length} reference texts`);
        }



        // Function to clear all locations (made available globally)
        function clearAllLocations() {
            try {
                locationManager.clearAllLocations();
                console.log('All component locations cleared');
            } catch (error) {
                console.error('Failed to clear locations:', error);
            }
        }

        // Make clearAllLocations available globally
        window.clearAllLocations = clearAllLocations;

        // Function to load saved positions
        async function loadSavedPositions() {
            // Load locations and then apply them (async for server storage)
            try {
                await locationManager.loadLocations();
                const components = svg.querySelectorAll('g[data-component]');
                components.forEach(component => {
                    const componentRef = component.getAttribute('data-component');
                    
                    // Create a component object for the location manager
                    const componentObj = {
                        reference: componentRef,
                        symbol: 'unknown',
                        footprint: 'unknown',
                        value: 'unknown'
                    };
                    
                    // Check if we have a saved position
                    const savedLocation = locationManager.getLocation(componentObj);
                    if (savedLocation) {
                        // Apply the saved position and rotation
                        const rotation = savedLocation.rotation || 0;
                        let transform = `translate(${savedLocation.x}, ${savedLocation.y})`;
                        
                        if (rotation !== 0) {
                            // Get component bounding box to calculate rotation center
                            const bbox = component.getBBox();
                            const centerX = bbox.x + bbox.width / 2;
                            const centerY = bbox.y + bbox.height / 2;
                            transform += ` rotate(${rotation} ${centerX} ${centerY})`;
                        }
                        
                        component.setAttribute('transform', transform);
                        // Mark 180° rotation so CSS can flip pin texts
                        const normalized = ((rotation % 360) + 360) % 360;
                        if (normalized === 180) {
                            component.setAttribute('data-rotated-180', 'true');
                        } else {
                            component.removeAttribute('data-rotated-180');
                        }
                        console.log(`Loaded saved position for ${componentRef}: (${savedLocation.x}, ${savedLocation.y}) rotation: ${rotation}°`);
                    }
                });
                
                // Load saved reference text positions
                const referenceTexts = svg.querySelectorAll('text[data-reference]');
                referenceTexts.forEach(textElement => {
                    const componentRef = textElement.getAttribute('data-reference');
                    
                    // Create a component object for the location manager
                    const componentObj = {
                        reference: componentRef,
                        symbol: 'unknown',
                        footprint: 'unknown',
                        value: 'unknown'
                    };
                    
                    // Check if we have a saved reference text position
                    const savedTextPosition = locationManager.getReferenceTextPosition(componentObj);
                    if (savedTextPosition) {
                        // Apply the saved position
                        textElement.setAttribute('x', savedTextPosition.x.toString());
                        textElement.setAttribute('y', savedTextPosition.y.toString());
                        console.log(`Loaded saved reference text position for ${componentRef}: (${savedTextPosition.x}, ${savedTextPosition.y})`);
                    }
                    
                    // Initialize original position tracking for this reference text
                    // This ensures that future symbol movements will use the correct baseline
                    const currentX = parseFloat(textElement.getAttribute('x')) || 0;
                    const currentY = parseFloat(textElement.getAttribute('y')) || 0;
                    textElement._originalX = currentX;
                    textElement._originalY = currentY;
                });
                
                // Ensure reference text is on the topmost layer after loading
                ensureReferenceTextOnTop();
                
                // Draw wires after positions are loaded
                updateWires();
            } catch (error) {
                console.error('Failed to load saved positions:', error);
                // Still draw wires even if loading failed
                updateWires();
            }
        }

        // Function to load updated SVG from server
        async function loadUpdatedSvg() {
            try {
                const title = document.title || 'schematic';
                const schematicName = title.replace(' - KiCad Symbol Viewer', '').toLowerCase().replace(/[^a-z0-9]/g, '_');
                
                const response = await fetch(`/api/get-svg/${schematicName}`);
                if (response.ok) {
                    const svgContent = await response.text();
                    const svgContainer = document.getElementById('svg-container');
                    svgContainer.innerHTML = svgContent;
                    
                    // Update the svg reference to point to the new SVG element
                    svg = getSvg();
                    console.log('Loaded updated SVG from server and updated reference');
                    
                    // Re-initialize panning for the new SVG
                    initializePanning();
                    
                    // Save the updated SVG back to the server to ensure it's persisted
                    await saveUpdatedSvgToServer();
                    
                    return true;
                } else {
                    console.log('No updated SVG found on server, using embedded SVG');
                    return false;
                }
            } catch (error) {
                console.warn('Could not load updated SVG from server:', error);
                return false;
            }
        }
        
        // Function to save the current SVG state to server
        async function saveUpdatedSvgToServer() {
            try {
                const title = document.title || 'schematic';
                const schematicName = title.replace(' - KiCad Symbol Viewer', '').toLowerCase().replace(/[^a-z0-9]/g, '_');
                
                const currentSvg = getSvg();
                if (currentSvg) {
                    // Create a clean copy of the SVG without zoom transforms
                    const cleanSvg = currentSvg.cloneNode(true);
                    
                    // Remove zoom transform group and move its children back to the main SVG
                    const transformGroup = cleanSvg.querySelector('#zoom-transform-group');
                    if (transformGroup) {
                        const children = Array.from(transformGroup.children);
                        children.forEach(child => {
                            cleanSvg.appendChild(child);
                        });
                        transformGroup.remove();
                    }
                    
                    // Reset zoom and pan to default values
                    cleanSvg.setAttribute('width', '2000');
                    cleanSvg.setAttribute('height', '1500');
                    
                    const updatedSvgContent = cleanSvg.outerHTML;
                    const svgResponse = await fetch(`/api/save-svg/${schematicName}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ svgContent: updatedSvgContent })
                    });
                    
                    if (svgResponse.ok) {
                        console.log('Updated SVG automatically saved to server');
                    } else {
                        console.warn('Failed to automatically save updated SVG to server:', svgResponse.statusText);
                    }
                }
            } catch (error) {
                console.warn('Could not automatically save updated SVG to server:', error);
            }
        }

        // Function to handle component selection
        function selectComponent(componentElement) {
            console.log('selectComponent called with:', componentElement ? componentElement.getAttribute('data-component') : 'null');
            
            // Remove selection from all components and reference text
            const allComponents = svg.querySelectorAll('g[data-component]');
            allComponents.forEach(comp => {
                comp.classList.remove('component-selected');
            });
            
            // Remove selection from all reference text elements
            const allReferenceTexts = svg.querySelectorAll('text[data-reference]');
            allReferenceTexts.forEach(text => {
                text.classList.remove('reference-selected');
            });
            
            // Select the clicked component
            if (componentElement) {
                componentElement.classList.add('component-selected');
                selectedComponent = componentElement;
                console.log('Selected component:', componentElement.getAttribute('data-component'));
                
                // Apply selection styling to reference text
                applyReferenceSelection(componentElement);
            } else {
                selectedComponent = null;
                console.log('Deselected all components');
            }
            
            // Ensure reference text stays on top after selection
            ensureReferenceTextOnTop();
            
            // Debug: Log all selection bounding boxes after selection is complete
            setTimeout(() => {
                const allBoxes = svg.querySelectorAll('.selection-bounding-box');
                console.log('=== FINAL STATE: All selection bounding boxes ===');
                allBoxes.forEach((box, index) => {
                    console.log('Box ' + (index + 1) + ':', {
                        id: box.getAttribute('id'),
                        x: box.getAttribute('x'),
                        y: box.getAttribute('y'),
                        width: box.getAttribute('width'),
                        height: box.getAttribute('height'),
                        class: box.getAttribute('class')
                    });
                });
                console.log('=== END FINAL STATE ===');
                
                // Also check for any other rectangles that might be visible
                const allRects = svg.querySelectorAll('rect');
                console.log('=== ALL RECTANGLES IN SVG ===');
                allRects.forEach((rect, index) => {
                    const stroke = rect.getAttribute('stroke');
                    const fill = rect.getAttribute('fill');
                    if (stroke === '#4CAF50' || stroke === 'rgb(76, 175, 80)' || 
                        (stroke && stroke.includes('4CAF50')) || 
                        (stroke && stroke.includes('76, 175, 80'))) {
                        console.log('Green rectangle ' + (index + 1) + ':', {
                            id: rect.getAttribute('id'),
                            class: rect.getAttribute('class'),
                            x: rect.getAttribute('x'),
                            y: rect.getAttribute('y'),
                            width: rect.getAttribute('width'),
                            height: rect.getAttribute('height'),
                            stroke: stroke,
                            fill: fill
                        });
                    }
                });
                console.log('=== END ALL RECTANGLES ===');
            }, 10);
        }
        
        // Function to apply selection styling to reference text element
        function applyReferenceSelection(componentElement) {
            if (!componentElement) return;
            
            const componentRef = componentElement.getAttribute('data-component');
            if (!componentRef) return;
            
            // Find the corresponding reference text element
            const referenceTextElement = svg.querySelector(`text[data-reference="${componentRef}"]`);
            if (!referenceTextElement) return;
            
            // Apply the same selection styling as symbols
            referenceTextElement.classList.add('reference-selected');
        }
        
        // Function to move reference text with symbol during dragging
        function moveReferenceTextWithSymbol(componentRef, newOffset) {
            const referenceTextElement = svg.querySelector(`text[data-reference="${componentRef}"]`);
            if (!referenceTextElement) return;
            
            // Get the symbol's original position (stored when dragging started)
            const symbolOriginalX = referenceTextElement._symbolOriginalX || 0;
            const symbolOriginalY = referenceTextElement._symbolOriginalY || 0;
            
            // Use separate tracking for symbol-relative positioning to avoid conflicts
            // with independent text dragging (_originalX/_originalY)
            if (!referenceTextElement._symbolDragBaseX) {
                // Store the reference text position at the start of symbol dragging
                referenceTextElement._symbolDragBaseX = parseFloat(referenceTextElement.getAttribute('x')) || 0;
                referenceTextElement._symbolDragBaseY = parseFloat(referenceTextElement.getAttribute('y')) || 0;
            }
            
            // Calculate the delta (change) from the symbol's original position
            const deltaX = newOffset.x - symbolOriginalX;
            const deltaY = newOffset.y - symbolOriginalY;
            
            // Apply the delta to the reference text's position at the start of symbol dragging
            const newX = referenceTextElement._symbolDragBaseX + deltaX;
            const newY = referenceTextElement._symbolDragBaseY + deltaY;
            
            // Update the reference text position
            referenceTextElement.setAttribute('x', newX.toString());
            referenceTextElement.setAttribute('y', newY.toString());
        }
        




        // Function to rotate selected component
        function rotateSelectedComponent() {
            if (!selectedComponent) {
                console.log('No component selected for rotation');
                return;
            }
            
            const componentRef = selectedComponent.getAttribute('data-component');
            const currentTransform = selectedComponent.getAttribute('transform') || 'translate(0, 0)';
            
            // Parse current transform
            let currentX = 0;
            let currentY = 0;
            let currentRotation = 0;
            
            // Extract translate values
            if (currentTransform.includes('translate(')) {
                const translateStart = currentTransform.indexOf('translate(') + 10;
                const translateEnd = currentTransform.indexOf(')', translateStart);
                const coords = currentTransform.substring(translateStart, translateEnd).split(',');
                if (coords.length === 2) {
                    currentX = parseFloat(coords[0].trim());
                    currentY = parseFloat(coords[1].trim());
                }
            }
            
            // Extract rotate values
            if (currentTransform.includes('rotate(')) {
                const rotateStart = currentTransform.indexOf('rotate(') + 7;
                const rotateEnd = currentTransform.indexOf(')', rotateStart);
                const rotateValue = currentTransform.substring(rotateStart, rotateEnd).trim();
                currentRotation = parseFloat(rotateValue.split(' ')[0]) || 0;
            }
            
            // Increment rotation by 90 degrees
            const newRotation = (currentRotation + 90) % 360;
            
            // Get component bounding box to calculate rotation center
            const bbox = selectedComponent.getBBox();
            const centerX = bbox.x + bbox.width / 2;
            const centerY = bbox.y + bbox.height / 2;
            
            // Apply new transform with rotation around component center
            const newTransform = `translate(${currentX}, ${currentY}) rotate(${newRotation} ${centerX} ${centerY})`;
            selectedComponent.setAttribute('transform', newTransform);
            
            // Mark 180° rotation so CSS can flip pin texts
            const normalizedRotation = ((newRotation % 360) + 360) % 360;
            if (normalizedRotation === 180) {
                selectedComponent.setAttribute('data-rotated-180', 'true');
            } else {
                selectedComponent.removeAttribute('data-rotated-180');
            }
            
            // Keep all text elements upright and readable
            // Handle reference text (should not rotate at all)
            const referenceTextElement = svg.querySelector(`text[data-reference="${componentRef}"]`);
            if (referenceTextElement) {
                // Reference text should stay completely upright - no rotation needed
                // Just ensure it has no transform that would make it rotate
                referenceTextElement.removeAttribute('transform');
                console.log(`Kept reference text for ${componentRef} upright (no rotation)`);
            }
            
            // Handle all text elements within the component (pin names, pin numbers, etc.)
            // The SVG generator now correctly positions pin names and numbers relative to pin coordinates.
            // Since the component group is rotated, the text inside will naturally rotate with it.
            // We should NOT apply any counter-rotations as they interfere with the natural positioning.
            // Let the text rotate naturally with the component - this is standard CAD behavior.
            const componentTextElements = selectedComponent.querySelectorAll('text');
            componentTextElements.forEach(textElement => {
                // Remove any existing transforms on the text elements
                // Let them rotate naturally with the component group
                textElement.removeAttribute('transform');
                
                console.log(`Removed transform from component text to let it rotate naturally with component`);
            });
            
            // Update wires after rotation
            updateWires();
            
            // Save the new rotation
            const component = {
                reference: componentRef,
                symbol: 'unknown',
                footprint: 'unknown',
                value: 'unknown'
            };
            
            if (locationManager) {
                const symbolContent = selectedComponent.outerHTML;
                locationManager.setLocation(component, currentX, currentY, symbolContent, newRotation);
            }
            
            console.log(`Rotated component ${componentRef} to ${newRotation} degrees`);
        }

        // Add keyboard event listener for rotation
        document.addEventListener('keydown', (event) => {
            if (event.key.toLowerCase() === 'r' && selectedComponent) {
                event.preventDefault();
                rotateSelectedComponent();
            }
            // ESC key to deselect
            if (event.key === 'Escape') {
                selectComponent(null);
            }
        });
        
        // Add click event listener for component selection on background
        document.addEventListener('click', (event) => {
            // Only deselect if click was on empty space (not on a component or reference text)
            const clickedComponent = event.target.closest('g[data-component]');
            const clickedReferenceText = event.target.closest('text[data-reference]');
            
            if (!clickedComponent && !clickedReferenceText) {
                // Clicked on empty space - deselect all
                selectComponent(null);
            }
        });

        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', async () => {
                // Try to load updated SVG from server first
                const updatedSvgLoaded = await loadUpdatedSvg();
                
                // Initialize location manager after DOM is ready
                locationManager = new ComponentLocationManager();
                console.log('Location manager initialized for server storage');
                
                await loadSavedPositions();
                initializeDragging();
                // Draw initial wires after everything is loaded
                setTimeout(() => {
                    updateWires();
                    updatePinConnectionIndicators();
                }, 100);
            });
        } else {
            // Initialize location manager after DOM is ready
            locationManager = new ComponentLocationManager();
            console.log('Location manager initialized for server storage');
            
            (async () => {
                // Try to load updated SVG from server first
                const updatedSvgLoaded = await loadUpdatedSvg();
                
                await loadSavedPositions();
                initializeDragging();
                // Draw initial wires after everything is loaded
                setTimeout(() => {
                    updateWires();
                    updatePinConnectionIndicators();
                }, 100);
            })();
        }
    </script>
